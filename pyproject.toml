[project]
name = "cosmonaut-backend"
version = "0.1.0"
description = "Cosmonaut AI backend Lambdaolith"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aws-lambda-powertools[all]",
    "boto3",
    "fastapi",
    "pynamodb",
    "pydantic",
    "pydantic-settings",
    "pydantic-ai-slim[retries]",
    "tenacity",
    "pinecone>=8.0.0",
    "google-genai>=1.56.0",
    "pydantic-ai>=1.37.0",
    "pyjwt[crypto]>=2.10.1",
    "nest-asyncio>=1.6.0",
    "cryptography>=46.0.3",
    "uvicorn>=0.38.0",
    "stripe>=11.0.0",
    "httpx>=0.28.0",
    "cachetools>=6.2.4",
]


[dependency-groups]
dev = [
    "boto3-stubs[all]>=1.42.18",
    "httpx",
    "pytest",
    "uvicorn>=0.38.0",
]

[tool.ruff]
line-length = 120
indent-width = 2
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "T20", "ASYNC"]
ignore = [
  "B008",    # FastAPI uses Depends()/Body()/Query()/Path() in function defaults by design
  "RUF002",  # EN DASH in docstrings is intentional style
  "RUF003",  # EN DASH in comments is intentional style
  "SIM108",  # Ternary operator not always more readable
]
fixable = ["ALL"]
